# Netlify-configuratie. Staat bewust in de repo (in plaats van enkel in de Netlify-UI),
# zodat de buildinstellingen mee versioned zijn.

[build]
  # fetch-data draait hier bewust NIET meer. Sinds v0.2 komt de data uit de API's van
  # Onderwijs en Vorming, met een API-key. Het schoolaanbod verandert praktisch één keer per
  # schooljaar, dus bij elke deploy 5 gepagineerde API-calls doen is verspilling en maakt de
  # build afhankelijk van een externe dienst. De gecommitte public/data/*.json is de bron.
  # Verversen: lokaal `npm run fetch-data` en de JSON mee committen. Zie CLAUDE.md.
  # Gevolg: ONDERWIJS_API_KEY hoeft NIET in de Netlify-omgeving te staan.
  command = "npm run build"
  publish = "dist"

  # Sla de build over als er in een push niets anders dan documentatie veranderde.
  # Netlify draait dit commando vóór de build: exit 0 = build annuleren, exit 1 = wel bouwen.
  # `git diff --quiet` geeft 0 als er GEEN verschillen zijn — dus als er buiten de .md-bestanden
  # niets wijzigde, wordt er niet gebouwd. CLAUDE.md en README.md zitten niet in de site,
  # dus daar valt niets te deployen.
  # ⚠️ Wordt een .md-bestand ooit wél een build-input (bv. content die Vite inleest), haal het
  # dan hier uit de uitsluiting — anders mist de site stilzwijgend een update.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

[build.environment]
  # Vite 8 vereist Node ^20.19.0 || >=22.12.0 (geverifieerd via node_modules/vite/package.json).
  NODE_VERSION = "22"

  # SECRETS_SCAN_OMIT_KEYS is bewust WEG: de ORS-key zit sinds de proxy niet meer in de
  # bundle, dus secret scanning mag onverkort z'n werk doen. Slaat het toch aan op
  # ORS_API_KEY, dan is dat een echt lek en moet het opgelost worden, niet onderdrukt.

# Geen SPA-redirect nodig: de app gebruikt enkel querystring-state (?lat=..&straal=..),
# geen path-based routing. Alles wordt vanaf / geserveerd.

# Netlify blijft de site ook op de standaard *.netlify.app-URL serveren. Twee adressen met
# dezelfde inhoud is slecht voor zoekmachines en verwarrend om te delen, dus sturen we alles
# permanent door naar het echte domein. De /* en :splat houden pad en querystring intact
# (?lat=..&straal=..), force = true zorgt dat de regel wint van het bestaande bestand.
# Deploy previews (deploy-preview-123--zoekjeschool.netlify.app) hebben een andere host en
# blijven dus gewoon werken.
[[redirects]]
  from = "https://zoekjeschool.netlify.app/*"
  to = "https://zoekjeschool.be/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: de site hoeft nooit in een iframe te staan.
    X-Frame-Options = "DENY"
    # Voorkomt MIME-sniffing.
    X-Content-Type-Options = "nosniff"
    # Lek het volledige pad (incl. gezochte locatie in de querystring) niet naar externe sites
    # zoals de aangeklikte schoolwebsites of de OSM-tileservers.
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # CSP toegespitst op wat de app écht gebruikt:
    #   connect-src : geo.api.vlaanderen.be (adres zoeken). api.transitous.org voor het
    #                 reisadvies met het openbaar vervoer — die roepen we bewust rechtstreeks
    #                 aan en niet via een eigen proxy, want Transitous herkent browsergebruik
    #                 aan de Referer, en die verdwijnt achter een proxy. api.heigit.org staat
    #                 er NIET bij: de fietsroute loopt via onze eigen /api/fietsroute
    #                 (same-origin), want die heeft wél een geheime key.
    #                 queue.simpleanalyticscdn.com ontvangt de analytics-events (Beacon API).
    #   script-src  : scripts.simpleanalyticscdn.com voor het analytics-script.
    #   img-src     : OSM-tiles (*.tile.openstreetmap.org) + data:/blob: voor Leaflet-markers,
    #                 plus queue.simpleanalyticscdn.com voor de pixel-fallback.
    #   style-src   : 'unsafe-inline' is nodig — Leaflet zet inline styles op kaartlagen
    # Geen 'unsafe-inline'/'unsafe-eval' voor script-src: noch de Vite-bundle, noch Simple
    # Analytics heeft dat nodig (dat is bij SA enkel vereist voor "automated events").
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://queue.simpleanalyticscdn.com; connect-src 'self' https://geo.api.vlaanderen.be https://api.transitous.org https://queue.simpleanalyticscdn.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
